buildscript {
    repositories {
        google()  // Required for Google dependencies
        mavenCentral()  // Fallback repository
    }
    ext.kotlin_version = "1.8.22" // Replace with your version if already set
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.1'  // Ensure version is correct
        classpath 'com.android.tools.build:gradle:8.8.0'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
